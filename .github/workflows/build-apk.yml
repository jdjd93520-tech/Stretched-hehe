# Requested rebuild
name: Build DisplayHotKeys Android APK

on:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'DisplayHotKeysAndroid-project (1).zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q 'DisplayHotKeysAndroid-project (1).zip' -d source
          test -f source/DisplayHotKeysAndroid/app/build.gradle

      - name: Apply Android public API compatibility fix
        working-directory: source/DisplayHotKeysAndroid
        run: |
          sed -i 's/d\.getUniqueId()/String.valueOf(d.getDisplayId())/' app/src/main/java/com/example/displayhotkeys/MainActivity.java
          sed -i 's/displays.get(i)\.getUniqueId()\.equals(unique)/String.valueOf(displays.get(i).getDisplayId()).equals(unique)/' app/src/main/java/com/example/displayhotkeys/MainActivity.java

      - name: Build debug APK
        working-directory: source/DisplayHotKeysAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DisplayHotKeys-debug-apk
          path: source/DisplayHotKeysAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
